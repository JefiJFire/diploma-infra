name: terraform

# Pull request: fmt, validate и plan, результат плана приходит комментарием.
# Коммит в main: apply.
on:
  pull_request:
    paths: ["terraform/infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Два apply одновременно испортили бы state
concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Ключ сервисного аккаунта
        env:
          SA_KEY: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          echo 'bucket = "${{ secrets.STATE_BUCKET }}"' > backend.hcl
          terraform init -backend-config=backend.hcl -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        shell: bash   # включает pipefail: при ошибке plan шаг падает, а не скрывается за tee
        run: terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Комментарий с планом в PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/infra/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan\n```\n' + plan + '\n```'
            });

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -input=false tfplan